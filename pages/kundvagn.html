<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kundvagn - KittyStore</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div id="navbar"></div>

  <main>
    <h2>Kundvagn</h2>
    <div id="cartList" class="cart-box"></div>

    <div class="order-card" id="orderCard">
      
       <form id="orderForm">
      <input type="text" id="customerName" placeholder="Namn" required />
      <input type="email" id="customerEmail" placeholder="E-post" required />
      <input type="text" id="customerAddress" placeholder="Leveransadress" required />
      <button type="submit">Skicka order</button>
    </form>
    
    <div id="orderConfirmation" class="hidden">
      <div class="confirmation-header">
        <span class="checkmark">✓</span>
        <h3>Tack för din beställning!</h3>
      </div>
         
      <p>Vi har tagit emot din order och skickar en bekräftelse via e-post.</p>

       <div id="receiptContent"></div>
    </div>
   </div>    
   
  </main>

  <script src="../js/loadNavbar.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/ui.js"></script>

</body>
</html>
